# =============================================================================
#  Presupuesto — MySQL + aplicación
#
#  Mismo montaje que Miplan: la app se ata a 127.0.0.1 en el host y quien la
#  publica es el Caddy del host, que pone el HTTPS y el filtro por IP.
#  Sin ese "127.0.0.1:" delante, Docker abriría el puerto a internet
#  saltándose el cortafuegos.
#
#  Puerto 3001 porque el 3000 ya lo ocupa Miplan.
# =============================================================================

services:

  db:
    image: mysql:8.4
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS:?falta DB_ROOT_PASS en .env}
      MYSQL_DATABASE: ${DB_NAME:-presupuesto}
      MYSQL_USER: ${DB_USER:-presupuesto}
      MYSQL_PASSWORD: ${DB_PASS:?falta DB_PASS en .env}
      TZ: Europe/Madrid
    volumes:
      - datos-mysql:/var/lib/mysql
      # Solo se ejecutan la PRIMERA vez, con el volumen vacío. El prefijo
      # numérico importa: MySQL los lanza en orden alfabético y el esquema
      # tiene que ir antes que la semilla.
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - ./db/presupuesto.sql:/docker-entrypoint-initdb.d/03-presupuesto.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${DB_ROOT_PASS}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-presupuesto}
      DB_USER: ${DB_USER:-presupuesto}
      DB_PASS: ${DB_PASS}
      HOST: 0.0.0.0
      PUERTO: 3000
      TZ: Europe/Madrid
    volumes:
      - ./uploads:/app/uploads
    ports:
      - "127.0.0.1:${PUERTO_HOST:-3001}:3000"

volumes:
  datos-mysql:
